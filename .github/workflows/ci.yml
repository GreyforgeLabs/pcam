name: PCAM v3 Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcam-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            python: "3.12.3"
            rust: "1.93.0"
            manifest: tests/cross-platform/linux-x86_64.json
            mode: check
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            python: "3.12"
            rust: stable
            manifest: tests/cross-platform/linux-arm64.json
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Select Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt
          rustup default "${{ matrix.rust }}"

      - name: Install Python validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" ruff==0.15.0

      - name: Report execution architecture
        run: python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Check Python lint
        run: python -m ruff check reference/python experiments

      - name: Run Python conformance suite
        run: python -m pytest reference/python/tests

      - name: Check Rust formatting
        run: cargo fmt --manifest-path independent/rust/Cargo.toml --check

      - name: Run independent Rust suite
        run: cargo test --manifest-path independent/rust/Cargo.toml --locked

      - name: Verify pinned cross-platform digest manifest
        run: python experiments/run_cross_platform.py --check "${{ matrix.manifest }}"
