name: PCAM v3 Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            manifest: tests/cross-platform/linux-x86_64.json
            mode: check
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            manifest: tests/cross-platform/linux-arm64.json
            mode: generate
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" ruff

      - name: Report execution architecture
        run: python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Check Python lint
        run: python -m ruff check reference/python experiments

      - name: Run Python conformance suite
        run: python -m pytest reference/python/tests

      - name: Check Rust formatting
        run: cargo fmt --manifest-path independent/rust/Cargo.toml --check

      - name: Run independent Rust suite
        run: cargo test --manifest-path independent/rust/Cargo.toml --locked

      - name: Verify Linux x86-64 digest manifest
        if: matrix.mode == 'check'
        run: python experiments/run_cross_platform.py --check "${{ matrix.manifest }}"

      - name: Generate Linux ARM64 digest manifest
        if: matrix.mode == 'generate'
        run: python experiments/run_cross_platform.py --output "${{ matrix.manifest }}"

      - name: Upload Linux ARM64 evidence
        if: matrix.mode == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: pcam-linux-arm64-evidence
          path: tests/cross-platform/linux-arm64.json
          if-no-files-found: error
